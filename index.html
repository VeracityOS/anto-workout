<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0f141b" />
<title>WOD Planner</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="WOD" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0f141b; --surface:#171e29; --elev:#1f2837; --elev2:#27313f;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#F8FAFC; --muted:#94A3B8; --faint:#64748b;
  --orange:#F97316; --orange2:#FB923C; --amber:#FBBF24;
  --green:#22C55E; --red:#EF4444; --blue:#38BDF8;
  --r:16px; --tap:46px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.5;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
h1,h2,h3,.disp,.num{font-family:'Barlow Condensed','Barlow',sans-serif;letter-spacing:.3px}
h1{font-size:30px;font-weight:700;margin:0;text-transform:uppercase}
h2{font-size:22px;font-weight:700;margin:0 0 8px;text-transform:uppercase}
h3{font-size:18px;font-weight:600;margin:0}
.num{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.app{max-width:560px;margin:0 auto;padding:0 14px}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* Header */
header.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 70%,transparent);
  padding:calc(10px + env(safe-area-inset-top)) 0 8px;backdrop-filter:blur(6px)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--orange);
  display:grid;place-items:center;flex:0 0 auto}
.brand .mark svg{width:20px;height:20px}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  padding:6px 11px;border-radius:999px;font-weight:600;font-size:14px}
.streak .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.wcard{position:relative;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .1s}
.wcard:active{transform:scale(.99)}
.wcard .accent{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--orange)}
.wcard .accent.ladder{background:var(--green)}
.wcard h3{font-size:21px;text-transform:uppercase}
.wcard .pl{padding-left:8px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--elev);
  color:var(--muted);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
.tag.hot{background:rgba(249,115,22,.16);color:var(--orange2);border-color:rgba(249,115,22,.3)}
.tag.g{background:rgba(34,197,94,.15);color:#86efac;border-color:rgba(34,197,94,.3)}
.meta{display:flex;gap:14px;margin-top:10px;font-size:13px}
.meta b{font-family:'Barlow Condensed';font-size:18px;font-weight:700}
.chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--faint)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--tap);
  padding:0 18px;border-radius:12px;font-weight:600;font-size:16px;transition:filter .15s,background .15s;
  background:var(--elev);border:1px solid var(--line2)}
.btn:active{filter:brightness(1.15)}
.btn.primary{background:var(--orange);color:#1a1206;border:none}
.btn.go{background:var(--green);color:#04230f;border:none}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:rgba(239,68,68,.4);color:#fca5a5}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn.icon{padding:0;width:var(--tap);flex:0 0 auto}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:25;
  width:56px;height:56px;border-radius:18px;background:var(--orange);color:#1a1206;
  display:grid;place-items:center;box-shadow:0 8px 24px rgba(249,115,22,.4)}
.fab svg{width:28px;height:28px}

/* Bottom nav */
/* --- Return to Training --- */
.rbar{height:8px;border-radius:999px;background:var(--elev);overflow:hidden;margin:9px 0 3px}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--amber));border-radius:999px;transition:width .3s}
.card.warn{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.32)}
.card.ok{background:rgba(34,197,94,.07);border-color:rgba(34,197,94,.28)}
.ssum{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.ssum .chev2{margin-left:auto;color:var(--faint);flex:0 0 auto;transition:transform .18s}
.ssum.open .chev2{transform:rotate(90deg)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:none}
.kv .r{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wkstep{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:4px}
.wkstep button{width:36px;height:36px;border-radius:10px;background:var(--elev);border:1px solid var(--line);color:var(--muted);font-size:19px;line-height:1}
.wkstep b{font-family:'Barlow Condensed';font-size:19px;letter-spacing:.5px;min-width:112px;text-align:center}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(15,20,27,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 8px;color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
nav.tabbar a.active{color:var(--orange)}
nav.tabbar a svg{width:23px;height:23px}

/* Sections / breakdown */
.section-h{display:flex;align-items:center;gap:8px;margin:18px 0 6px}
.section-h .k{font-family:'Barlow Condensed';font-size:13px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--orange2)}
.section-h .ln{flex:1;height:1px;background:var(--line)}
.scheme{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0}
.pip{min-width:38px;text-align:center;padding:7px 4px;border-radius:10px;background:var(--elev);
  border:1px solid var(--line);font-family:'Barlow Condensed';font-weight:700;font-size:19px}
.pip small{display:block;font-size:10px;color:var(--faint);font-family:'Barlow';font-weight:600;letter-spacing:.5px}
.exline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.exline:last-child{border-bottom:none}
.exline .reps{font-family:'Barlow Condensed';font-weight:700;font-size:19px;min-width:42px;color:var(--orange2)}
.exline .nm{flex:1}
.exline .mm{font-size:11.5px;color:var(--faint);text-transform:capitalize}
.round-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(249,115,22,.14);
  color:var(--orange2);border:1px solid rgba(249,115,22,.3);padding:4px 11px;border-radius:999px;
  font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px}

/* Body map */
.bodywrap{background:var(--elev);border:1px solid var(--line);border-radius:14px;padding:8px 8px 6px}
.bodyimg{position:relative;width:100%;aspect-ratio:1000/747;border-radius:11px;overflow:hidden;isolation:isolate}
.bodyimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.moverlay{position:absolute;inset:0;pointer-events:none;
  -webkit-mask:url(assets/body-mask.png) center/100% 100% no-repeat;
  mask:url(assets/body-mask.png) center/100% 100% no-repeat}
.mblob{position:absolute;border-radius:50%;filter:blur(4px);mix-blend-mode:hard-light}
.bm-label{text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:12px;
  letter-spacing:1px;color:var(--faint);text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:12.5px;text-transform:capitalize;
  background:var(--surface);border:1px solid var(--line);padding:4px 9px;border-radius:999px}
.legend .sw{width:11px;height:11px;border-radius:3px}

/* Forms */
label.fld{display:block;margin:12px 0 0}
label.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.5px}
.input,select.input{width:100%;background:var(--elev);border:1px solid var(--line2);border-radius:11px;
  color:var(--text);padding:11px 13px;min-height:var(--tap)}
.input:focus,select.input:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
textarea.input{min-height:64px;resize:vertical}
.row2{display:flex;gap:9px}
.row2>*{flex:1}
.exrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.exrow .input{margin:0}
.exrow .w-name{flex:1}
.exrow .w-rep{width:64px;flex:0 0 auto}
.exrow .w-unit{width:78px;flex:0 0 auto}
.exrow .del{flex:0 0 auto;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  color:#fca5a5;background:rgba(239,68,68,.1)}
.seg{display:flex;background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--orange);color:#1a1206}

/* Session logging */
.logitem{display:flex;align-items:center;gap:11px;padding:11px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);margin:8px 0}
.logitem.done{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.06)}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--line2);flex:0 0 auto;
  display:grid;place-items:center;color:transparent;transition:.15s}
.logitem.done .check{background:var(--green);border-color:var(--green);color:#04230f}
.li-main{flex:1;min-width:0}
.li-main .t{font-weight:600}
.li-main .s{font-size:12.5px;color:var(--faint)}
.w-in{width:74px;flex:0 0 auto}
.w-in .input{text-align:center;padding:9px 6px;min-height:42px}
.last{font-size:11px;color:var(--faint);text-align:center;margin-top:2px}

/* Plan */
.dayrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.dayrow .dn{width:46px;font-family:'Barlow Condensed';font-weight:700;font-size:17px;text-transform:uppercase}
.dayrow .pick{flex:1}
.today-pill{font-size:10px;background:var(--orange);color:#1a1206;padding:1px 7px;border-radius:999px;font-weight:700}

/* History */
.histitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.histitem .cal{width:48px;text-align:center;flex:0 0 auto}
.histitem .cal .d{font-family:'Barlow Condensed';font-weight:700;font-size:24px;line-height:1}
.histitem .cal .mo{font-size:11px;color:var(--faint);text-transform:uppercase}
.statline{display:flex;gap:16px;margin-top:3px;font-size:12.5px;color:var(--muted)}
.statline b{color:var(--text);font-family:'Barlow Condensed';font-size:15px}

.empty{text-align:center;padding:50px 20px;color:var(--faint)}
.empty svg{width:54px;height:54px;opacity:.4;margin-bottom:12px}
.backlink{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:600;margin:8px 0 2px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--green);color:#04230f;font-weight:700;padding:11px 20px;border-radius:999px;z-index:60;
  box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="app"><div class="top-row">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12h2M19 12h2M6.5 9v6M17.5 9v6M9 11h6v2H9z" stroke="#1a1206" stroke-width="2.2" stroke-linecap="round"/></svg></span>
    <h1>WOD</h1>
  </div>
  <div style="display:flex;align-items:center;gap:9px">
    <div class="streak"><span class="dot"></span><span id="streakTxt">0</span></div>
    <a class="btn icon sm" href="#/settings" aria-label="Settings" style="width:40px;min-height:40px;background:var(--surface);border-color:var(--line)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 003.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H8a1.65 1.65 0 001-1.51V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V8a1.65 1.65 0 001.51 1H22a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.6"/></svg></a>
  </div>
</div></div></header>

<main class="app" id="app"></main>

<a class="fab" href="#/new" id="fab" aria-label="New workout"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></a>

<nav class="tabbar" id="tabbar">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Workouts</a>
  <a href="#/plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M3.5 9h17M8 3v3M16 3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Plan</a>
  <a href="#/return" data-tab="return"><svg viewBox="0 0 24 24" fill="none"><path d="M2.5 12.5h4l2-5 3.5 9 2.5-6 1.8 2h5.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Return</a>
  <a href="#/history" data-tab="history"><svg viewBox="0 0 24 24" fill="none"><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/></svg>History</a>
</nav>

<div class="toast" id="toast"></div>

<script>
//==================== STORAGE ====================
const KEY='wodplanner.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
let S=load();
if(!S){ S={workouts:seedWorkouts(),plan:{},history:[],prefs:{unit:'kg'}}; save(); }
if(!S.prefs) S.prefs={unit:'kg'};
if(!S.ret) S.ret={started:null,done:{},kipPU:true,kipTTB:false,weekOffset:0};

//==================== SEED ====================
function seedWorkouts(){
  const sm=(name,main,acc,metMoves,rounds=4)=>({id:uid(),name,type:'sm',
    strength:{mainLift:main,scheme:[12,10,8,6,4,2],accessories:acc},
    metcon:{rounds,order:'any',movements:metMoves}});
  const A=(name,reps,unit)=>({name,reps,unit:unit||'reps'});
  const ROBIN='Round-robin sit-ups (AbMat / decline weighted / side toe touch / cycle crunch)';
  return [
    // ---- Shoulders / thruster ----
    sm('Thruster Day','Thruster',
      [A('Shoulder press',8),A('Lateral raises',8),A('Erg',10,'cal')],
      [A('Weighted cable crunches',10),A('Snatches',8),A('AbMat sit-ups',20),A('Run',200,'m')]),

    // ---- Clean ----
    sm('Clean Day — A','Clean',
      [A('Seated row',8),A('Lat pulldown',8),A('Burpees',5)],
      [A('Pull-ups',10),A('AbMat sit-ups',20),A('Run',200,'m')]),
    sm('Clean Day — B','Clean',
      [A('Seated row',8),A('Lat pulldown',8),A('Burpees',5)],
      [A('Weighted cable crunches',10),A('Renegade rows',8),A('Pull-ups',8),A('AbMat sit-ups',20),A('Run',200,'m')]),
    sm('Clean Day — C','Clean',
      [A('Seated row',8),A('Lat pulldown',8),A('Burpees',8)],
      [A('Assault bike',12,'cal'),A('Renegade rows',8),A('Pull-ups',8),A('Ab roll-outs',8)]),

    // ---- Back squat ----
    sm('Back Squat Day','Back squat',
      [A('Walking lunge (DB, 4/leg)',8),A('Hamstring curl (machine)',8),A('Skips',60)],
      [A(ROBIN,20),A('Wall DB press / thruster',10),A('Bodyweight lunge (5/side)',10),A('Run',200,'m')]),

    // ---- Push press ----
    sm('Push Press Day — A','Push press',
      [A('Chest press',8),A('Cable fly + biceps',8),A('Assault bike',8,'cal')],
      [A('Toes-to-bar',10),A('Dips',10),A('Cable crunches',10),A('Run',200,'m')]),
    sm('Push Press Day — B','Push press',
      [A('Chest press',8),A('Cable fly + biceps',8),A('Dips',8),A('Erg',10,'cal')],
      [A('Toes-to-bar',10),A('Burpees',5),A('Cable crunches',10),A('DB man makers',3),A('Run',200,'m')]),

    // ---- Leg press ----
    sm('Leg Press Day — A','Leg press',
      [A('Hamstring curl',8),A('Lunges',8),A('Skips',60)],
      [A('Toes-to-bar',10),A('Ab roll-outs',10),A('DB thrusters',10),A('Weighted cable crunches',10),A('Run / Row / Bike',200,'m')]),
    sm('Leg Press Day — B','Leg press',
      [A('Bulgarian split squats',8),A('Box jumps',8),A('Skips',60)],
      [A(ROBIN,20),A('Wall DB press / thruster',10),A('Toes-to-bar',10),A('Run',200,'m')]),
    sm('Leg Press Day — C','Leg press',
      [A('Leg raises',8),A('Bulgarian split squats',8),A('Skips',60)],
      [A('Toes-to-bar',10),A('Weighted sit-ups',10),A('DB thrusters',10),A('Weighted cable crunches',10),A('Run / Row / Bike',200,'m')]),

    // ---- Ladder days (rounds not stated in source; 4 assumed) ----
    sm('Deadlift Day','Deadlift',
      [A('Hamstring curl (machine)',8),A('Hip raises (plate or barbell)',8),A('Burpees',10)],
      [A('Run',200,'m'),A('Box jumps',10),A('Cossack squats',8),A('Mountain climbers',20)]),
    sm('Overhead Press Day','Overhead press',
      [A('DB snatches (4/arm)',8),A('Shoulder press machine (light)',8),A('American KB swings',10)],
      [A('Run',200,'m'),A('DB snatches (lighter)',10),A('Dips',8),A('Ab roll-outs',8)]),
    sm('Bench Press Day','Bench press',
      [A('Tricep dips',8),A('Cable flys',8),A('Burpees',8)],
      [A('Assault bike',12,'cal'),A('Press-ups',10),A('DB clean and jerk',8),A('Sit-ups (vary each round)',20)]),

    // ---- Ladder ----
    {id:uid(),name:'21-15-9 Burner',type:'ladder',
      ladder:{scheme:[21,15,9],
        movements:[A('Thruster',0),A('Pull-ups',0),A('KB swings',0),A('AbMat sit-ups',0),A('Burpees',0)],
        finisher:'200m run'}}
  ];
}

//==================== RETURN TO TRAINING ====================
// Six-week graded on-ramp after PFO closure. 20-minute sessions.
// Movement names carry {PU}/{TTB} markers resolved against the kipping toggles.
const RA=(name,reps,unit)=>({name,reps,unit:unit||'reps'});

function retName(n){
  return String(n).replace('{PU}', S.ret.kipPU?'Kipping pull-ups':'Strict pull-ups')
                  .replace('{TTB}', S.ret.kipTTB?'Kipping toes-to-bar':'Strict toes-to-bar');
}
function retWeek(){
  if(!S.ret.started) return 0;
  const days=Math.floor((Date.now()-new Date(S.ret.started).getTime())/864e5);
  return Math.min(7,Math.max(1,Math.floor(days/7)+1+(S.ret.weekOffset||0)));
}
function retBlockIdx(){const w=retWeek();return w<=2?0:w<=4?1:2}
function retTotalSessions(){return RET_BLOCKS.reduce((n,b)=>n+b.sessions.length*2,0)}
function retDoneCount(){return Object.values(S.ret.done).filter(Boolean).length}

let retOpen={};
function retToggle(k){retOpen[k]=!retOpen[k];returnView()}
function retStart(){S.ret.started=new Date().toISOString();S.ret.weekOffset=0;save();returnView();toast('Week 1 — go steady')}
function retShiftWeek(d){
  const w=retWeek(); if((w<=1&&d<0)||(w>=7&&d>0))return;
  S.ret.weekOffset=(S.ret.weekOffset||0)+d;save();retOpen={};returnView();
}
function retTick(key){
  const w=retWeek(), id=key+'-w'+w;
  S.ret.done[id]=!S.ret.done[id];save();returnView();
  if(S.ret.done[id]) toast('Logged ✓');
}
function retKip(which){
  if(which==='pu') S.ret.kipPU=!S.ret.kipPU; else S.ret.kipTTB=!S.ret.kipTTB;
  save();returnView();
}
function retAdd(key){
  const sess=RET_BLOCKS.flatMap(b=>b.sessions).find(x=>x.key===key);
  if(!sess) return;
  const w={id:uid(),name:sess.name+' (Return)',type:sess.type};
  if(sess.type==='ladder'){
    w.ladder={scheme:[...sess.ladder.scheme],
      movements:sess.ladder.movements.map(m=>({...m,name:retName(m.name)})),
      finisher:sess.ladder.finisher};
  } else {
    w.strength={mainLift:retName(sess.strength.mainLift),scheme:[...sess.strength.scheme],
      accessories:sess.strength.accessories.map(m=>({...m,name:retName(m.name)}))};
    w.metcon={rounds:sess.metcon.rounds,order:sess.metcon.order,
      movements:sess.metcon.movements.map(m=>({...m,name:retName(m.name)}))};
  }
  S.workouts.push(w);save();toast('Added to Workouts');
}

function musclesFor(name){
  const n=(' '+name+' ').toLowerCase();
  const m=new Set(); let cardio=false;
  for(const r of RULES){ if(r.kw.some(k=>n.includes(k))){ r.m.forEach(x=>m.add(x)); if(r.c)cardio=true; } }
  return {muscles:[...m],cardio};
}
function workoutMovements(w){
  if(w.type==='ladder') return w.ladder.movements.map(x=>x.name);
  return [w.strength.mainLift, ...w.strength.accessories.map(x=>x.name), ...w.metcon.movements.map(x=>x.name)];
}
function muscleCounts(w){
  const c={}; let cardio=false;
  for(const nm of workoutMovements(w)){ const r=musclesFor(nm); r.muscles.forEach(mu=>c[mu]=(c[mu]||0)+1); if(r.cardio)cardio=true; }
  return {counts:c,cardio};
}

function lerpC(a,b,t){const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const A=p(a),B=p(b);return[Math.round(A[0]+(B[0]-A[0])*t),Math.round(A[1]+(B[1]-A[1])*t),Math.round(A[2]+(B[2]-A[2])*t)]}
function heatRGB(count,max){
  if(!count) return [57,65,79];
  const t=max>1?(count-1)/(max-1):1;
  return lerpC('#FBA94C','#DC2626',t);
}
function heat(count,max){const c=heatRGB(count,max);return`rgb(${c[0]},${c[1]},${c[2]})`}
const SCALE=1.22; // enlarge fills to cover the whole muscle
function bodyMap(w){
  const {counts,cardio}=muscleCounts(w);
  const max=Math.max(1,...Object.values(counts));
  let blobs='';
  for(const [mus,c] of Object.entries(counts)){
    const spots=OVERLAY[mus]; if(!spots) continue;
    const rgb=heatRGB(c,max); const col=`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    const fade=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`;
    const t=max>1?(c-1)/(max-1):1; const op=(0.78+0.22*t).toFixed(2);
    for(const [cx,cy,rx0,ry0] of spots){
      const rx=rx0*SCALE, ry=ry0*SCALE;
      blobs+=`<span class="mblob" style="left:${(cx-rx).toFixed(2)}%;top:${(cy-ry).toFixed(2)}%;width:${(rx*2).toFixed(2)}%;height:${(ry*2).toFixed(2)}%;background:radial-gradient(ellipse at center,${col} 0%,${col} 60%,${fade} 100%);opacity:${op}"></span>`;
    }
  }
  const used=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const legend=used.length?`<div class="legend">${used.map(([m,c])=>
    `<span class="lg"><span class="sw" style="background:${heat(c,max)}"></span>${ML[m]||m}</span>`).join('')}
    ${cardio?`<span class="lg"><span class="sw" style="background:#38BDF8"></span>Cardio</span>`:''}</div>`
    :`<div class="muted" style="text-align:center;padding:8px">Add exercises to see muscles worked</div>`;
  return `<div class="bodywrap">
    <div class="bodyimg"><img src="assets/body.jpg" alt="Muscles worked" loading="lazy"><div class="moverlay">${blobs}</div></div>
    <div style="display:flex"><div class="bm-label" style="flex:1">Front</div><div class="bm-label" style="flex:1">Back</div></div>
    ${legend}</div>`;
}

const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const u=()=>S.prefs.unit;
function unitLabel(x){return x.unit&&x.unit!=='reps'?x.unit:'';}
function repLabel(x){
  if(x.reps===0||x.reps==null) return '';
  const ul=unitLabel(x); return ul?`${x.reps}${ul==='cal'?' cal':ul==='m'?'m':ul==='sec'?'s':' '+ul}`:`${x.reps}`;
}
function workoutById(id){return S.workouts.find(w=>w.id===id)}
function lastSession(wid){return S.history.filter(h=>h.workoutId===wid).sort((a,b)=>b.ts-a.ts)[0]}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function fmtDate(ts){const d=new Date(ts);return{d:d.getDate(),mo:d.toLocaleString('en',{month:'short'}),full:d.toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}}
function todayKey(){return ['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()]}
function computeStreak(){
  if(!S.history.length) return 0;
  const days=new Set(S.history.map(h=>new Date(h.ts).toDateString()));
  let n=0;const d=new Date();
  for(;;){ if(days.has(d.toDateString())){n++;d.setDate(d.getDate()-1);}
    else { if(n===0 && d.toDateString()===new Date().toDateString()){d.setDate(d.getDate()-1);continue;} break; } }
  return n;
}
function setStreak(){$('#streakTxt').textContent=computeStreak()+' day'+(computeStreak()===1?'':'s')}

//==================== ROUTER ====================
function go(h){location.hash=h}
window.addEventListener('hashchange',render);
function render(){
  const h=location.hash||'#/';
  const parts=h.slice(2).split('/');
  const route=parts[0]||'';
  document.querySelectorAll('nav.tabbar a').forEach(a=>a.classList.remove('active'));
  $('#fab').style.display = (route===''||route==='plan'||route==='history')?'grid':'none';
  let tab=route===''?'home':route==='plan'?'plan':route==='history'?'history':route==='return'?'return':null;
  if(tab) document.querySelector(`nav.tabbar a[data-tab="${tab}"]`)?.classList.add('active');
  window.scrollTo(0,0);
  if(route===''){homeView()}
  else if(route==='w'){detailView(parts[1])}
  else if(route==='new'){builderView(null)}
  else if(route==='edit'){builderView(parts[1])}
  else if(route==='do'){sessionView(parts[1])}
  else if(route==='plan'){planView()}
  else if(route==='history'){historyView()}
  else if(route==='return'){returnView()}
  else if(route==='settings'){settingsView()}
  else{homeView()}
  setStreak();
}

function dupWorkout(id){

//==================== BUILDER ====================
let DRAFT=null;
function builderView(id){
  if(id){ const w=workoutById(id); DRAFT=JSON.parse(JSON.stringify(w)); }
  else { DRAFT={id:uid(),name:'',type:'sm',
      strength:{mainLift:'',scheme:[12,10,8,6,4,2],accessories:[{name:'',reps:8,unit:'reps'}]},
      metcon:{rounds:4,order:'any',movements:[{name:'',reps:10,unit:'reps'}]},

function drawBuilder(editing){
  const d=DRAFT;
  const unitOpts=v=>['reps','cal','m','sec'].map(o=>`<option value="${o}"${v===o?' selected':''}>${o}</option>`).join('');

    <label class="fld"><span>Main lift</span><input class="input" placeholder="e.g. Thruster" value="${esc(d.strength.mainLift)}" oninput="DRAFT.strength.mainLift=this.value"></label>
    <label class="fld"><span>Rep scheme (comma separated)</span><input class="input num" value="${d.strength.scheme.join('-')}" oninput="dScheme('strength',this.value)" placeholder="12-10-8-6-4-2"></label>
    <div style="font-size:13px;color:var(--muted);margin:14px 0 2px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Accessories</div>
    <div id="grp-acc">${d.strength.accessories.map((x,i)=>exRow(x,'acc',i)).join('')}</div>

    <div class="section-h"><span class="k">Conditioning</span><span class="ln"></span></div>
    <div class="row2">
      <label class="fld" style="margin:0"><span>Rounds</span><input class="input num" type="number" inputmode="numeric" value="${d.metcon.rounds}" oninput="DRAFT.metcon.rounds=+this.value||1"></label>
      <label class="fld" style="margin:0"><span>Order</span><select class="input" onchange="DRAFT.metcon.order=this.value"><option value="any"${d.metcon.order==='any'?' selected':''}>Any order</option><option value="seq"${d.metcon.order==='seq'?' selected':''}>In order</option></select></label>
    </div>
    <div style="font-size:13px;color:var(--muted);margin:14px 0 2px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Movements</div>
    <div id="grp-met">${d.metcon.movements.map((x,i)=>exRow(x,'met',i)).join('')}</div>

    <label class="fld"><span>Rep scheme</span><input class="input num" value="${d.ladder.scheme.join('-')}" oninput="dScheme('ladder',this.value)" placeholder="21-15-9"></label>
    <div style="font-size:13px;color:var(--muted);margin:14px 0 2px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Movements</div>
    <div id="grp-lad">${d.ladder.movements.map((x,i)=>exRow(x,'lad',i)).join('')}</div>
    <button class="btn sm ghost" style="margin-top:8px" onclick="dAdd('lad')">+ Add movement</button>
    <label class="fld"><span>Finisher (optional)</span><input class="input" placeholder="e.g. 200m run" value="${esc(d.ladder.finisher||'')}" oninput="DRAFT.ladder.finisher=this.value"></label>`;

function updatePreview(){const el=$('#bPrev'); if(el) el.outerHTML=bodyMap(normalizedDraft()).replace('class="bodywrap"','class="bodywrap" id="bPrev" style="margin-top:18px"');}
function normalizedDraft(){return DRAFT}
function dType(t){DRAFT.type=t;drawBuilder(S.workouts.some(w=>w.id===DRAFT.id))}
function dScheme(which,val){const arr=val.split(/[-,\s]+/).map(n=>parseInt(n)).filter(n=>n>0);
  if(which==='strength')DRAFT.strength.scheme=arr.length?arr:[1]; else DRAFT.ladder.scheme=arr.length?arr:[1];}
function grpArr(grp){return grp==='acc'?DRAFT.strength.accessories:grp==='met'?DRAFT.metcon.movements:DRAFT.ladder.movements}
function dEx(grp,i,f,v){const a=grpArr(grp);if(!a[i])return; a[i][f]= f==='reps'?(+v||0):v; if(f==='name')liveMuscle();}
function liveMuscle(){clearTimeout(window._mt);window._mt=setTimeout(updatePreview,400)}
function dAdd(grp){grpArr(grp).push({name:'',reps:grp==='lad'?0:(grp==='acc'?8:10),unit:'reps'});drawBuilder(S.workouts.some(w=>w.id===DRAFT.id))}
function dDel(grp,i){const a=grpArr(grp);a.splice(i,1);if(!a.length)a.push({name:'',reps:0,unit:'reps'});drawBuilder(S.workouts.some(w=>w.id===DRAFT.id))}
function dSave(){
  const d=DRAFT;
  if(!d.name.trim()){toast('Add a name');return}
  if(d.type==='sm'){ if(!d.strength.mainLift.trim()){toast('Add a main lift');return}
    d.strength.accessories=d.strength.accessories.filter(x=>x.name.trim());
    d.metcon.movements=d.metcon.movements.filter(x=>x.name.trim());
  } else { d.ladder.movements=d.ladder.movements.filter(x=>x.name.trim());
    if(!d.ladder.movements.length){toast('Add a movement');return} }
  const idx=S.workouts.findIndex(w=>w.id===d.id);
  if(idx>=0)S.workouts[idx]=d; else S.workouts.push(d);
  save();toast('Saved');go('#/w/'+d.id);
}

//==================== SESSION (log) ====================
let SES=null;
function sessionView(id){
  const w=workoutById(id);
  if(!w){app.innerHTML=emptyState('Not found','');return}
  const last=lastSession(id);
  const lw=(key)=>last&&last.weights&&last.weights[key]!=null?last.weights[key]:'';
  // build items
  const items=[];
  if(w.type==='ladder'){
    w.ladder.movements.forEach((m,k)=>items.push({key:'l'+k,t:m.name,s:w.ladder.scheme.join('-')+' reps',weight:true}));
    if(w.ladder.finisher)items.push({key:'lf',t:w.ladder.finisher,s:'finisher',weight:false});
  } else {
    w.strength.scheme.forEach((r,i)=>items.push({key:'s'+i,t:w.strength.mainLift,s:'Set '+(i+1)+' × '+r+' reps',weight:true,reps:r}));
    w.strength.accessories.forEach((a,j)=>items.push({key:'a'+j,t:a.name,s:repLabel(a)+' '+unitLabel(a),weight:musclesFor(a.name).cardio?false:true}));
    items.push({div:'Conditioning — '+w.metcon.rounds+' rounds'});
    w.metcon.movements.forEach((m,k)=>items.push({key:'m'+k,t:m.name,s:(w.metcon.rounds)+'× '+repLabel(m)+' '+unitLabel(m),weight:musclesFor(m.name).cardio?false:true}));
  }
  SES={wid:id,items,start:Date.now(),done:{},weights:{}};
  // prefill weights from last
  items.forEach(it=>{ if(it.key){const v=lw(it.key); if(v!=='')SES.weights[it.key]=v;} });

  let html=`<a class="backlink" href="#/w/${id}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Back</a>
  <h2>${esc(w.name)}</h2>
  <div class="muted" style="margin:-4px 0 6px;font-size:14px">Tap to mark done · log the weight you used (${u()})</div>
  <div id="sesList">${items.map(it=>sesItemHTML(it,lw)).join('')}</div>
  <button class="btn go block" style="margin:16px 0 6px" onclick="finishSession()">Finish &amp; Save</button>
  <button class="btn ghost block" onclick="quickComplete()">Mark complete (no logging)</button>`;
  app.innerHTML=html;
}
function sesItemHTML(it,lw){
  if(it.div) return `<div class="section-h"><span class="k">${esc(it.div)}</span><span class="ln"></span></div>`;
  const last=lw?lw(it.key):'';
  const wval=SES.weights[it.key]!=null?SES.weights[it.key]:'';
  return `<div class="logitem" id="li-${it.key}">
    <button class="check" onclick="toggleDone('${it.key}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="li-main"><div class="t">${esc(it.t)}</div><div class="s">${esc(it.s||'')}</div></div>
    ${it.weight?`<div class="w-in"><input class="input num" type="number" inputmode="decimal" placeholder="${u()}" value="${wval}" oninput="SES.weights['${it.key}']=this.value">${last!==''?`<div class="last">last ${last}</div>`:''}</div>`:''}
  </div>`;
}
function toggleDone(key){SES.done[key]=!SES.done[key];$('#li-'+key)?.classList.toggle('done',SES.done[key])}
function calcVolume(){let v=0;const w=workoutById(SES.wid);
  if(w&&w.type==='sm'){w.strength.scheme.forEach((r,i)=>{const wt=parseFloat(SES.weights['s'+i]); if(wt>0)v+=wt*r;});}
  return Math.round(v);}
function finishSession(){
  const vol=calcVolume();
  const entry={id:uid(),workoutId:SES.wid,name:workoutById(SES.wid).name,ts:Date.now(),
    durationSec:Math.round((Date.now()-SES.start)/1000),weights:{...SES.weights},
    doneCount:Object.values(SES.done).filter(Boolean).length,volume:vol||null,unit:u()};
  S.history.unshift(entry);save();toast('Session saved 💪');go('#/history');
}
function quickComplete(){
  const entry={id:uid(),workoutId:SES.wid,name:workoutById(SES.wid).name,ts:Date.now(),
    durationSec:0,weights:{},doneCount:0,volume:null,unit:u(),quick:true};
  S.history.unshift(entry);save();toast('Marked complete ✓');go('#/history');
}

  html+=`<div class="card"><div class="statline" style="margin:0">
    <span>Sessions <b class="num">${S.history.length}</b></span>
    <span>Streak <b class="num">${computeStreak()}</b></span>
    ${totVol?`<span>Total volume <b class="num">${totVol.toLocaleString()}${u()}</b></span>`:''}</div></div>`;
  html+=S.history.map(h=>{const f=fmtDate(h.ts);
    return `<div class="histitem">
      <div class="cal"><div class="d num">${f.d}</div><div class="mo">${f.mo}</div></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600">${esc(h.name)}</div>
        <div class="statline">
          ${h.quick?'<span>✓ marked complete</span>':`${h.doneCount?`<span><b class="num">${h.doneCount}</b> done</span>`:''}${h.volume?`<span><b class="num">${h.volume.toLocaleString()}${h.unit||''}</b> vol</span>`:''}${h.durationSec?`<span><b class="num">${Math.round(h.durationSec/60)}</b> min</span>`:''}`}
        </div>
      </div>
      <button class="btn icon ghost" onclick="delHist('${h.id}')" aria-label="Delete"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 7h12M9 7V5h6v2M8 7l1 12h6l1-12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>`}).join('');
  app.innerHTML=html;
}
function delHist(id){if(confirm('Delete this session?')){S.history=S.history.filter(h=>h.id!==id);save();historyView();}}

//==================== SETTINGS ====================
function settingsView(){
  const unit=u();
  let html=`<a class="backlink" href="#/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Workouts</a>
  <h2>Settings</h2>
  <label class="fld"><span>Weight unit</span>
    <div class="seg">
      <button class="${unit==='kg'?'on':''}" onclick="setUnit('kg')">Kilograms (kg)</button>
      <button class="${unit==='lb'?'on':''}" onclick="setUnit('lb')">Pounds (lb)</button>
    </div>
  </label>
  <p class="muted" style="font-size:13.5px;margin-top:8px">New logs use this unit. Past sessions keep the unit they were saved in.</p>
  <hr class="sep">
  <div class="section-h"><span class="k">Your Data</span><span class="ln"></span></div>
  <div class="card"><div class="statline" style="margin:0">
    <span>Workouts <b class="num">${S.workouts.length}</b></span>
    <span>Sessions <b class="num">${S.history.length}</b></span>
  </div></div>
  <button class="btn ghost block" style="margin-top:10px" onclick="exportData()">Export data (backup)</button>
  <button class="btn ghost block" style="margin-top:10px" onclick="importData()">Import data (restore)</button>
  <button class="btn danger block" style="margin-top:10px" onclick="resetData()">Reset to default workouts</button>
  <p class="faint" style="font-size:12.5px;text-align:center;margin-top:18px">WOD Planner · offline · data stored on this device</p>`;
  app.innerHTML=html;
}
function setUnit(x){S.prefs.unit=x;save();settingsView();toast('Unit set to '+x)}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='wod-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded');
}
function importData(){
  const i=document.createElement('input');i.type='file';i.accept='application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.workouts)throw 0;
      S=Object.assign({workouts:[],plan:{},history:[],prefs:{unit:'kg'}},d);save();toast('Data restored');go('#/');
    }catch(e){toast('Invalid file')}};r.readAsText(f);};
  i.click();
}
function resetData(){
  if(!confirm('Reset all workouts to the original 6? Your logged history is kept.'))return;
  S.workouts=seedWorkouts();S.plan={};save();toast('Reset to defaults');go('#/');
}

//==================== INIT ====================
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));}
</script>
</body>
</html>
